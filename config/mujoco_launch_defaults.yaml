# MuJoCo 仿真统一启动默认参数配置（替代 launch.py 中的大量硬编码默认值）。
# 所有键值仍可通过 ros2 launch ... key:=value 在命令行按需覆写。

localization:
  localization_source: "truth"
  use_identified_odometry: "false"
  launch_small_gicp_relocalization: "true"
  lio_lease_wall_scale: "auto"
  mujoco_odom_topic: "/odometry"
  fusion_odom_topic: "/odometry"
  imu_topic: "/livox/imu"
  imu_rate_hz: "200.0"
  ground_truth_odom_topic: "/simulation/ground_truth/odometry"
  ground_truth_rate_hz: "50.0"
  livox_points_topic: "/mujoco/livox_points"
  lidar_segment_ms: "5.0"
  lidar_state_queue_depth: "2"
  lidar_threads: "0"          # 0 = affinity-aware CPU budget (1/3 cores, max 8)
  lidar_max_range: "40.0"
  lidar_self_exclusion: "true"
  noise_seed: "20260723"
  enable_range_noise: "false"
  range_noise_sigma_m: "0.02"
  enable_imu_noise: "false"
  enable_imu_saturation: "false"
  lidar_mount_preset: "chassis"
  lidar_mount_x: "0.2405"
  lidar_mount_y: "0.0"
  lidar_mount_height: "0.20"
  lidar_mount_tilt_direction: "front"
  lidar_mount_tilt_deg: "30.0"
  base_footprint_height: "0.18"
  start_roll: "0.0"
  start_pitch: "0.0"
  enable_test_obstacle_fixture: "false"

auto_mapping:
  slam: "false"
  launch_mapping_cruise: "false"
  mapping_cruise_tree: "rmuc_2026_test_mapping_points"
  mapping_cruise_csv_name: "rmuc_2027_mapping_cruise_waypoints.csv"
  mapping_cruise_stable_sec: "1.5"
  mapping_cruise_start_delay_sec: "1.0"
  save_odom_layer_on_shutdown: "false"
  mapping_output_prefix: ""
  odom_layer_origin_x: ""
  odom_layer_origin_y: ""

simulation:
  planning_grid_owner: "rog_map"
  use_sim_time: "false"
  enable_static_walls: "false"
  use_viewer: "false"
  show_viewer: "false"
  viewer_rate_hz: "15.0"
  launch_physics: "true"
  launch_navigation: "true"
  use_rviz: "false"
  launch_mujoco_rviz: "false"
  launch_terrain_analysis: "false"
  force_body_yaw_follow: "false"
  body_yaw_follow_clearance: "0.55"
  spin_enabled: "true"
  spin_rate: "3.0"
  enable_lidar: "true"
  lidar_backend: "cpu"
  lidar_downsample: "auto"
  lidar_rate_hz: "auto"
  lidar_rate_clock: "sim"
  lidar_state_rate_hz: "30.0"
  enable_tof: "false"
  tof_backend: "cpu"
  tof_rate_hz: "10.0"
  freeze_motion: "false"
  sim_rate_hz: "auto"
  feedback_rate_hz: "10.0"
  truth_rate_hz: "10.0"
  command_timeout: "0.5"
  max_wheel_acceleration: "2.0"
  max_steer_rate: "10.4719755"
  max_linear_speed: "5.0"
  max_angular_z: "3.0"
  nav_start_delay_sec: "6.0"
  rog_map_start_delay_sec: "12.0"
  map_start_delay_sec: "1.0"
  rviz_delay_sec: "1.0"
  solver_mode: "qp"
  telemetry_sampling_window_cycles: "0"
  log_level: "info"

profiles:
  rmuc_2025:
    model_file: "rmuc_2025_swerve.xml"
    map_yaml_name: "rmuc_2025.yaml"
    prior_pcd_name: "rmuc_2025.pcd"
    start_x: "-0.18"
    start_y: "0.06"
    start_z: "0.381"
    start_yaw: "0.0"
    use_viewer: "true"
    show_viewer: "true"
    lidar_mount_preset: "chassis"
    odom_layer_origin_x: ""
    odom_layer_origin_y: ""

  rmuc_2027:
    model_file: "rmuc_2027_swerve.xml"
    map_yaml_name: "rmuc_2027.yaml"
    prior_pcd_name: "rmuc_2027.pcd"
    scene_navigation_profile_name: "rmuc_2027_navigation.yaml"
    start_x: "3.37"
    start_y: "9.03"
    start_z: "0.465"
    start_yaw: "0.0"
    use_viewer: "false"
    show_viewer: "false"
    lidar_mount_preset: "chassis"
    odom_layer_origin_x: "auto"
    odom_layer_origin_y: "auto"

  rmul_2027:
    model_file: "rmul_2027_swerve.xml"
    map_yaml_name: "rmul_2027.yaml"
    prior_pcd_name: "rmul_2027.pcd"
    scene_navigation_profile_name: "rmul_2027_navigation.yaml"
    start_x: "1.60"
    start_y: "1.20"
    start_z: "0.20"
    start_yaw: "0.0"
    use_viewer: "false"
    show_viewer: "false"
    lidar_mount_preset: "chassis"

  lio_localization_test:
    model_file: "rmuc_2027_swerve.xml"
    localization_source: "lio"
    lidar_mount_preset: "chassis"
    start_x: "4.0"
    start_y: "5.5"
    start_z: "0.381"
    start_yaw: "0.0"
    sim_rate_hz: "400.0"
    lidar_rate_hz: "20.0"
    lidar_downsample: "1"
