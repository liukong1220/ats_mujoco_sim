# 2027 隧道仿真单一事实源。坐标与 2027 场地地图一致，单位 m。
#
# 2026-10-24 起数值取自官方 RMUC2027_V1.0.0 网格（models/meshes/rmuc_2027.obj）的实测：
# 沿竖直方向逐点多次射线，精度约 1 cm；此前是估算值（整块 1.5 m x 1.2 m、顶板上表面 0.45 m）。
# 真实结构：
#   - 隧道是下沉的口袋：口袋底（floor_z）比两侧高台面低 0.2 m，西侧是约 9 度的缓坡；
#   - 两侧是高台块，内壁面在 y = axis_y -/+ width/2（净宽 0.795 m），南侧块一直延伸到 x = 17.7，
#     北侧块在 x = 15.57 结束；
#   - 顶板只是一块 0.34 m（沿轴）x 1.12 m（横向）x 0.167 m 厚的短横梁，盖在两侧高台块上，
#     下表面离口袋底 0.25 m，不是整段隧道的顶；
#   - 口袋底沿 y 有约 1.5 度的横向坡（y 1.7 处 0.135，y 2.3 处 0.151），floor_z 取轴线处的值。
# polygon 是顶板的投影矩形，roof_bottom_z / roof_top_z 是顶板下 / 上表面。
# corridor_polygon 是两侧高台块之间的净通道（x 从北侧块起点 13.30 到北侧块终点 15.57，
# y 取两个内壁面 1.645 / 2.44）；偏航对齐与通过性按这个窗口评估，顶板只是其中一小段。
# tunnel_B_mirror 是整个场地关于中心 (14, 8) 的点对称，实测与 tunnel_B 一致（顶板、净宽、口袋底均差 <= 1 cm）。
frame: map
tunnels:
  - name: tunnel_B
    polygon: [[14.76, 1.47], [15.10, 1.47], [15.10, 2.59], [14.76, 2.59]]
    corridor_polygon: [[13.30, 1.645], [15.57, 1.645], [15.57, 2.44], [13.30, 2.44]]
    floor_z: 0.144
    roof_bottom_z: 0.394
    roof_top_z: 0.561
    width: 0.795
    axis_yaw: 0.0
    entry: [12.90, 2.043, 0.0]
    exit: [16.10, 2.043, 0.0]
  - name: tunnel_B_mirror
    polygon: [[12.90, 13.41], [13.24, 13.41], [13.24, 14.53], [12.90, 14.53]]
    corridor_polygon: [[12.43, 13.56], [14.70, 13.56], [14.70, 14.355], [12.43, 14.355]]
    floor_z: 0.144
    roof_bottom_z: 0.394
    roof_top_z: 0.561
    width: 0.795
    axis_yaw: 3.141592653589793
    entry: [15.10, 13.957, 3.141592653589793]
    exit: [11.90, 13.957, 3.141592653589793]
# 悬空板（2026-10-30 按官方网格实测，报告 5.1.7）：下表面离下方地面 0.249-0.27 m，高于车高 0.242 m
# （用户 2026-10-30 确认，含雷达），车可以从板下通过。单值 hfield 会把板的上表面一直投影到地面，变成实心墙
# （domain 115 卡在 ramp_bridge 北口，底盘 z 0.24 -> 0.44）。这里列出的板不进入 hfield（rmuc_hfield.py），
# 碰撞由 rmuc_2027_roof_boxes.xml 里的盒子提供（rmuc_tunnel_roofs.py）。
# polygon 是板的投影矩形；bottom_z / top_z 是矩形中心处的下 / 上表面；板沿 y 有约 1.5 度的坡，
# slope_y = dz/dy（网格实测 0.0262），盒子按 atan(slope_y) 绕 x 轴倾斜。*_mirror 是关于 (14, 8) 的点对称。
overhangs:
  - name: ramp_bridge
    polygon: [[8.914, 2.585], [9.714, 2.585], [9.714, 2.935], [8.914, 2.935]]
    bottom_z: 0.6228
    top_z: 0.7216
    slope_y: 0.0262
  - name: ramp_bridge_mirror
    polygon: [[18.287, 13.069], [19.087, 13.069], [19.087, 13.418], [18.287, 13.418]]
    bottom_z: 0.6228
    top_z: 0.7216
    slope_y: -0.0262
  - name: south_plate
    polygon: [[13.802, 0.666], [14.152, 0.666], [14.152, 1.465], [13.802, 1.465]]
    bottom_z: 0.5685
    top_z: 0.5885
    slope_y: 0.0262
  - name: south_plate_mirror
    polygon: [[13.850, 14.538], [14.200, 14.538], [14.200, 15.337], [13.850, 15.337]]
    bottom_z: 0.5685
    top_z: 0.5885
    slope_y: -0.0262
