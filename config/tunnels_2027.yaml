# 2027 隧道仿真单一事实源。坐标与 2027 场地地图一致，单位 m。
#
# 2026-10-24 起数值取自官方 RMUC2027_V1.0.0 网格（models/meshes/rmuc_2027.obj）的实测：
# 沿竖直方向逐点多次射线，精度约 1 cm；此前是估算值（整块 1.5 m x 1.2 m、顶板上表面 0.45 m）。
# 真实结构：
#   - 隧道是下沉的口袋：口袋底（floor_z）比两侧高台面低 0.2 m，西侧是约 9 度的缓坡；
#   - 两侧是高台块，内壁面在 y = axis_y -/+ width/2（净宽 0.795 m），南侧块一直延伸到 x = 17.7，
#     北侧块在 x = 15.57 结束；
#   - 顶板只是一块 0.34 m（沿轴）x 1.12 m（横向）x 0.167 m 厚的短横梁，盖在两侧高台块上，
#     下表面离口袋底 0.25 m，不是整段隧道的顶；
#   - 口袋底沿 y 有约 1.5 度的横向坡（y 1.7 处 0.135，y 2.3 处 0.151），floor_z 取轴线处的值。
# polygon 是顶板的投影矩形，roof_bottom_z / roof_top_z 是顶板下 / 上表面。
# corridor_polygon 是两侧高台块之间的净通道（x 从北侧块起点 13.30 到北侧块终点 15.57，
# y 取两个内壁面 1.645 / 2.44）；偏航对齐与通过性按这个窗口评估，顶板只是其中一小段。
# tunnel_B_mirror 是整个场地关于中心 (14, 8) 的点对称，实测与 tunnel_B 一致（顶板、净宽、口袋底均差 <= 1 cm）。
frame: map
tunnels:
  - name: tunnel_B
    polygon: [[14.76, 1.47], [15.10, 1.47], [15.10, 2.59], [14.76, 2.59]]
    corridor_polygon: [[13.30, 1.645], [15.57, 1.645], [15.57, 2.44], [13.30, 2.44]]
    floor_z: 0.144
    roof_bottom_z: 0.394
    roof_top_z: 0.561
    width: 0.795
    axis_yaw: 0.0
    entry: [12.90, 2.043, 0.0]
    exit: [16.10, 2.043, 0.0]
  - name: tunnel_B_mirror
    polygon: [[12.90, 13.41], [13.24, 13.41], [13.24, 14.53], [12.90, 14.53]]
    corridor_polygon: [[12.43, 13.56], [14.70, 13.56], [14.70, 14.355], [12.43, 14.355]]
    floor_z: 0.144
    roof_bottom_z: 0.394
    roof_top_z: 0.561
    width: 0.795
    axis_yaw: 3.141592653589793
    entry: [15.10, 13.957, 3.141592653589793]
    exit: [11.90, 13.957, 3.141592653589793]
