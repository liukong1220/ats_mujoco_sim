# 布局 orientation=mirror_y，地图 12.6 x 8.6 m，原点在外框左下角。
# polygon 是顶板下方的槽（顶板投影），corridor_polygon 是该槽所在的 PGM 自由通道（沿轴线两个方向直到障碍）。
