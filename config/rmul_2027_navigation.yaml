# RMUL 2027 3V3 场景专用叠层参数（叠在 node_params.yaml + rmuc_2025_navigation.yaml 之上）。
# 像素分辨率（5 cm）、车高门（0.249 m）、jps_safe_distance（0.36）、GICP 体素（0.05 m / 10 邻域）
# 等通用参数已全部统一至 node_params.yaml，本文件仅保留 RMUL 2027 隧道走廊几何矩形。
ats_rog_map_adapter:
  ros__parameters:
    # 隧道走廊（tunnels_rmul_2027.yaml 沿轴向两端各延长约 0.6 m），格式 [xmin, ymin, xmax, ymax]。
    terrain_free_override_rects: [
      2.20, 0.45, 5.40, 1.25,        # tunnel_A（启动区一侧）
      7.20, 7.35, 10.40, 8.15]       # tunnel_B（关于场地中心 (6.3, 4.3) 点对称）
