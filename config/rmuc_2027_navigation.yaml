# RMUC 2027 场景专用叠层参数（叠在 node_params.yaml + rmuc_2025_navigation.yaml 之上）。
# 像素分辨率（5 cm）、车高门（0.249 m）、jps_safe_distance（0.36）等通用参数已全部统一至
# node_params.yaml，本文件仅保留 2027 物理场地隧道走廊几何矩形。
ats_rog_map_adapter:
  ros__parameters:
    # RMUC 2027 起点 map_from_odom.z = 0.285 m：场地最高可通行地面 0.305 m、南坡桥顶 0.436 m，
    # 而基地地面 0.6 m 动态障碍顶面在 odom 系仅 0.591 m；取 0.48 m 既避开桥顶/高地地面又即时捕获动态障碍。
    projection_min_height: 0.48
    # 6 个隧道走廊（每方 3 个，tunnels_2027.yaml 与 passages_2027.yaml 沿轴向两端各延长 0.6 m），
    # 格式 [xmin, ymin, xmax, ymax]；矩形内静态图明确 free 的格不被 terrain/坡度硬障碍误覆写，
    # 静态占据与 ROG 实时占据照旧生效。
    terrain_free_override_rects: [
      12.70, 1.645, 16.70, 2.44,     # tunnel_B（出口侧延长到 16.70）
      11.30, 13.56, 15.30, 14.355,   # tunnel_B_mirror
      8.885, 1.95, 9.71, 3.65,       # tunnel_ramp_bridge
      18.29, 12.35, 19.115, 14.05,   # tunnel_ramp_bridge_mirror
      12.00, 0.695, 16.10, 1.47,     # tunnel_south_plate
      11.90, 14.53, 16.00, 15.305]   # tunnel_south_plate_mirror
